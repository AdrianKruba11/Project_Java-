<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Biblioteki</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Witamy w Aplikacji Biblioteki!</h1>
    <div th:if="${result!=null}">
        <h2 th:text="${result}"/>
    </div>
    <nav>
        <ul>
            <li><a href="#books">Książki</a></li>
            <li><a href="#register">Rejestracja</a></li>
        </ul>
    </nav>
</header>

<main>
    <section id="books">
        <h2>Lista Książek</h2>
        <ul id="book-list">
            <li th:each="book: ${books}">
                <a th:text="${book.title}"></a>
                <a th:text="${book.author}"></a>
                <a th:text="${book.isbn}"></a>
            </li>
        </ul>
    </section>

    <section id="register">
        <h2>Rejestracja</h2>
        <form action="#" th:action="@{/register}" id="registration-form" th:object="${userdto}" method="post">
            <input type="text" id="username" placeholder="Nazwa użytkownika" required th:field="*{username}">
            <input type="password" id="password" placeholder="Hasło" required  th:field="*{password}">
            <input type="password" id="confirm-password" placeholder="Potwierdź hasło" required  th:field="*{confirmPassword}">
            <input type="submit">Zarejestruj się</input>
        </form>
        <div id="registration-message"></div>
    </section>
</main>

<footer>
    <p>&copy; 2024 Aplikacja Biblioteki</p>
</footer>

<script src="script.js"></script>
</body>
</html>
